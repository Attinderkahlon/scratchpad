name: Env and secrets

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: scratchpad
  LEVEL: workflow

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      LEVEL: job
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Node version
        run: node --version
      - name: LEVEL with step override
        env:
          LEVEL: step
        run: echo "APP_NAME=$APP_NAME LEVEL=$LEVEL"
      - name: LEVEL without step override
        run: echo "LEVEL=$LEVEL"
      - name: Default variables
        run: echo "sha=$GITHUB_SHA branch=$GITHUB_REF_NAME"
      - name: Config variable
        run: echo "style=${{ vars.GREETING_STYLE }}"
      - name: Secret, not passed in
        run: echo "token is [$FAKE_API_TOKEN]"
      - name: Secret, passed in
        env:
          TOKEN: ${{ secrets.FAKE_API_TOKEN }}
        run: |
          echo "token is [$TOKEN]"
          echo "length is ${#TOKEN}"
      - name: Save a value for later steps
        run: echo "BUILD_LABEL=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Read it back
        run: echo "label=$BUILD_LABEL"
